[project]
name = "lisbon-agent"
version = "0.1.0"
description = "Ticketing agent for the Lisbon check-in incident (AirCover rebooking and refund rules)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lisbon_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
